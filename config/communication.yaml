# Communication Configuration for Multi-Flow Integration
# Defines how flows communicate with each other and external systems

messaging:
  # Event bus configuration
  event_bus:
    type: "in-memory"  # Options: in-memory, redis, rabbitmq, kafka
    config:
      max_queue_size: 10000
      retry_attempts: 3
      retry_delay: 1000  # milliseconds

  # Message routing rules
  routing:
    - pattern: "flow.*.started"
      handlers: ["audit-logger", "metrics-collector"]
    - pattern: "flow.*.completed"
      handlers: ["audit-logger", "metrics-collector", "notification-service"]
    - pattern: "flow.*.failed"
      handlers: ["audit-logger", "error-handler", "notification-service"]
    - pattern: "data.*.processed"
      handlers: ["data-catalog", "quality-monitor"]

# Data sharing configuration
data_sharing:
  # Temporary storage for inter-flow data
  storage:
    type: "filesystem"  # Options: filesystem, s3, redis, database
    config:
      base_path: "/tmp/flow-data"
      cleanup_after: 3600  # seconds
      compression: true

  # Data transformation rules
  transformations:
    - from_type: "json"
      to_type: "csv"
      transformer: "json-to-csv"
    - from_type: "xml"
      to_type: "json"
      transformer: "xml-to-json"

# External integrations
integrations:
  # Webhook endpoints for external notifications
  webhooks:
    - name: "slack-notifications"
      url: "${SLACK_WEBHOOK_URL}"
      events: ["flow.*.failed", "workflow.*.completed"]
      headers:
        Content-Type: "application/json"
      retry_policy:
        max_attempts: 3
        backoff: "exponential"

    - name: "monitoring-system"
      url: "${MONITORING_WEBHOOK_URL}"
      events: ["flow.*.started", "flow.*.completed", "flow.*.failed"]
      headers:
        Authorization: "Bearer ${MONITORING_TOKEN}"

  # Email notifications
  email:
    smtp_server: "${SMTP_SERVER}"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from_address: "noreply@multiflow.example.com"
    
    templates:
      - name: "flow-failure"
        subject: "Flow Execution Failed: {{flow_name}}"
        body: |
          Flow: {{flow_name}}
          Version: {{flow_version}}
          Error: {{error_message}}
          Timestamp: {{timestamp}}
          
          Please check the logs for more details.

  # Database connections for state persistence
  databases:
    - name: "flow-state"
      type: "postgresql"
      connection_string: "${DATABASE_URL}"
      pool_size: 10
      tables:
        - "flow_executions"
        - "workflow_executions"
        - "flow_state"

# Security configuration
security:
  # API authentication
  authentication:
    type: "jwt"  # Options: jwt, api-key, oauth2
    config:
      secret: "${JWT_SECRET}"
      expiration: 3600
      issuer: "multi-flow-integration"

  # Encryption for sensitive data
  encryption:
    algorithm: "AES-256-GCM"
    key: "${ENCRYPTION_KEY}"
    
  # Access control
  permissions:
    - role: "admin"
      actions: ["*"]
    - role: "operator"
      actions: ["execute", "monitor", "read"]
    - role: "viewer"
      actions: ["read", "monitor"]

# Monitoring and observability
monitoring:
  # Metrics collection
  metrics:
    enabled: true
    collector: "prometheus"  # Options: prometheus, statsd, datadog
    endpoint: "${METRICS_ENDPOINT}"
    labels:
      service: "multi-flow-integration"
      environment: "${ENVIRONMENT}"

  # Distributed tracing
  tracing:
    enabled: true
    tracer: "jaeger"  # Options: jaeger, zipkin, datadog
    endpoint: "${TRACING_ENDPOINT}"
    sample_rate: 0.1

  # Health checks
  health_checks:
    - name: "event-bus"
      type: "tcp"
      target: "localhost:6379"
      interval: 30
    - name: "database"
      type: "sql"
      query: "SELECT 1"
      interval: 60

# Rate limiting and throttling
rate_limiting:
  # Global rate limits
  global:
    requests_per_minute: 1000
    concurrent_executions: 50

  # Per-flow rate limits
  per_flow:
    requests_per_minute: 100
    concurrent_executions: 5

  # Backpressure handling
  backpressure:
    strategy: "drop"  # Options: drop, queue, reject
    queue_size: 1000
    timeout: 30000  # milliseconds

# Error handling and recovery
error_handling:
  # Dead letter queue for failed messages
  dead_letter_queue:
    enabled: true
    max_retries: 3
    retention_period: 86400  # seconds

  # Circuit breaker configuration
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 60000  # milliseconds
    half_open_max_calls: 3

# Development and testing
development:
  # Mock services for testing
  mocks:
    enabled: true
    services: ["external-api", "email-service", "webhook-endpoints"]
  
  # Debug logging
  debug:
    enabled: false
    log_level: "debug"
    log_requests: true
    log_responses: true
