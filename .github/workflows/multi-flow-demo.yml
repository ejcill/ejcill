name: Multi-Flow Integration Demo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Workflow to execute'
        required: true
        default: 'complete-data-pipeline'
        type: choice
        options:
          - complete-data-pipeline
          - ci-cd-pipeline
      test_data:
        description: 'Test data for the workflow'
        required: false
        default: '{"test": true}'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      flows-changed: ${{ steps.changes.outputs.flows }}
      config-changed: ${{ steps.changes.outputs.config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^flows/'; then
            echo "flows=true" >> $GITHUB_OUTPUT
          else
            echo "flows=false" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E '^config/'; then
            echo "config=true" >> $GITHUB_OUTPUT
          else
            echo "config=false" >> $GITHUB_OUTPUT
          fi

  validate-flows:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.flows-changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Validate flow definitions
        run: |
          python -c "
          import sys
          sys.path.append('src')
          from flow_manager import FlowManager
          
          manager = FlowManager()
          count = manager.discover_flows()
          print(f'Validated {count} flows')
          
          # Validate each flow
          for flow in manager.list_flows():
              if not manager.validate_flow_dependencies(flow):
                  print(f'ERROR: Flow {flow.name} has invalid dependencies')
                  sys.exit(1)
              print(f'✓ Flow {flow.name} v{flow.version} is valid')
          "

  test-integration-engine:
    runs-on: ubuntu-latest
    needs: [setup, validate-flows]
    if: always() && (needs.setup.outputs.config-changed == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Test integration engine
        run: |
          cd src
          python -c "
          import asyncio
          import sys
          from flow_manager import FlowManager
          from integration_engine import IntegrationEngine
          
          async def test():
              # Initialize components
              flow_manager = FlowManager()
              flow_manager.discover_flows()
              
              engine = IntegrationEngine(flow_manager)
              
              # List workflows
              workflows = engine.list_workflows()
              print(f'Found {len(workflows)} workflows:')
              for w in workflows:
                  print(f'  - {w.name}: {w.description}')
              
              return len(workflows) > 0
          
          result = asyncio.run(test())
          if not result:
              print('ERROR: No workflows found')
              sys.exit(1)
          print('✓ Integration engine test passed')
          "

  execute-workflow:
    runs-on: ubuntu-latest
    needs: [validate-flows, test-integration-engine]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Execute workflow
        run: |
          cd src
          python -c "
          import asyncio
          import json
          import sys
          from flow_manager import FlowManager
          from integration_engine import IntegrationEngine
          
          async def execute():
              # Initialize components
              flow_manager = FlowManager()
              flow_manager.discover_flows()
              
              engine = IntegrationEngine(flow_manager)
              
              # Parse inputs
              workflow_name = '${{ github.event.inputs.workflow_name }}'
              test_data = json.loads('${{ github.event.inputs.test_data }}')
              
              print(f'Executing workflow: {workflow_name}')
              print(f'Test data: {test_data}')
              
              # Execute workflow
              try:
                  execution = await engine.execute_workflow(workflow_name, test_data)
                  print(f'Workflow execution completed with status: {execution.status.value}')
                  
                  for flow_name, flow_exec in execution.flow_executions.items():
                      print(f'  Flow \"{flow_name}\": {flow_exec.status.value}')
                      if flow_exec.error_message:
                          print(f'    Error: {flow_exec.error_message}')
                  
                  return execution.status.value == 'completed'
              except Exception as e:
                  print(f'Workflow execution failed: {e}')
                  return False
          
          success = asyncio.run(execute())
          if not success:
              sys.exit(1)
          "

  generate-report:
    runs-on: ubuntu-latest
    needs: [validate-flows, test-integration-engine]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate integration report
        run: |
          echo "# Multi-Flow Integration Report" > integration-report.md
          echo "" >> integration-report.md
          echo "**Generated:** $(date)" >> integration-report.md
          echo "**Commit:** ${{ github.sha }}" >> integration-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> integration-report.md
          echo "" >> integration-report.md
          
          echo "## Flow Validation" >> integration-report.md
          if [ "${{ needs.validate-flows.result }}" == "success" ]; then
            echo "✅ All flows validated successfully" >> integration-report.md
          else
            echo "❌ Flow validation failed" >> integration-report.md
          fi
          echo "" >> integration-report.md
          
          echo "## Integration Engine Test" >> integration-report.md
          if [ "${{ needs.test-integration-engine.result }}" == "success" ]; then
            echo "✅ Integration engine tests passed" >> integration-report.md
          else
            echo "❌ Integration engine tests failed" >> integration-report.md
          fi
          echo "" >> integration-report.md
          
          echo "## Available Flows" >> integration-report.md
          find flows/ -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "- \`$(basename "$file")\`" >> integration-report.md
          done
          echo "" >> integration-report.md
          
          echo "## Configuration Files" >> integration-report.md
          find config/ -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "- \`$(basename "$file")\`" >> integration-report.md
          done

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: integration-report.md

  notify:
    runs-on: ubuntu-latest
    needs: [validate-flows, test-integration-engine, execute-workflow]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Notify completion
        run: |
          if [ "${{ needs.validate-flows.result }}" == "success" ] && [ "${{ needs.test-integration-engine.result }}" == "success" ]; then
            echo "✅ Multi-flow integration system is working correctly"
          else
            echo "❌ Multi-flow integration system has issues"
            exit 1
          fi
